spring:
  application:
    name: TravelLog
  datasource:
    url: jdbc:postgresql://localhost:5432/travellog
    username: travellog
    password: travellog
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

travellog:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: ${TRAVELLOG_JWT_SECRET:TravelLogDevSecretKeyMustBeAtLeast32BytesLong!}
    expiration-ms: ${TRAVELLOG_JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.springframework.web: INFO
    org.flywaydb: INFO
    org.springframework.security: INFO
