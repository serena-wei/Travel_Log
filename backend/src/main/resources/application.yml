spring:
  application:
    name: TravelLog
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/travellog}
    username: ${SPRING_DATASOURCE_USERNAME:travellog}
    password: ${SPRING_DATASOURCE_PASSWORD:travellog}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

travellog:
  cors:
    # Comma-separated origins, e.g. https://d123.cloudfront.net,http://localhost:5173
    allowed-origins: ${TRAVELLOG_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${TRAVELLOG_JWT_SECRET:TravelLogDevSecretKeyMustBeAtLeast32BytesLong!}
    expiration-ms: ${TRAVELLOG_JWT_EXPIRATION_MS:86400000}
  s3:
    bucket: ${TRAVELLOG_S3_BUCKET:}
    region: ${TRAVELLOG_S3_REGION:ap-southeast-2}
    upload-url-expiry-seconds: ${TRAVELLOG_S3_UPLOAD_URL_EXPIRY_SECONDS:900}
    download-url-expiry-seconds: ${TRAVELLOG_S3_DOWNLOAD_URL_EXPIRY_SECONDS:3600}

logging:
  level:
    org.springframework.web: INFO
    org.flywaydb: INFO
    org.springframework.security: INFO
